name: Docs Sync

# Mirrors tLib's docs into the live site repo (TIMMYG-Studios/tWeb = timmygstudios.com).
# Self-contained (see tRadio): the shared reusable workflow is served stale by act_runner's
# ref cache, so inlining the steps is the reliable path.
#
# Both tWeb directories are named for the RESOURCE, not a product slug:
#   docs   -> src/content/docs/tLib   (the /docs/tLib/* URL)
#   assets -> public/assets/tLib      (tLib currently has no doc media; step is a no-op then)
# They used to disagree -- docs was lowercase `tlib` while assets was `tLib`. The lowercase
# URL still resolves: tWeb's docBySlug lookup is case-insensitive and the route answers with
# the camel-cased slug, so links shared before the rename redirect rather than 404.
#
# tLib is not a store product and so has no product slug. Where `tlib` IS still the right
# spelling is src/lib/changelog: it is a RemoteSource id there, mirroring GitHub releases
# onto /changelog?product=tlib. That namespace is lowercase and stays as it is.

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tLib (source)
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout tWeb (docs target)
        uses: https://github.com/actions/checkout@v4
        with:
          repository: TIMMYG-Studios/tWeb
          token: ${{ secrets.REPO_TOKEN }}
          path: tWeb
          fetch-depth: 1

      - name: Sync documentation + media
        env:
          DOCS_DIR: tLib
          ASSET_DIR: tLib
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p "tWeb/src/content/docs/$DOCS_DIR"
          rm -rf "tWeb/src/content/docs/$DOCS_DIR"/*
          cp docs/content/*.mdx "tWeb/src/content/docs/$DOCS_DIR/"

          # Overlay-copy media only (never wipe) — assets dir is shared with the software page.
          if [ -d docs/public ] && [ -n "$(ls -A docs/public 2>/dev/null)" ]; then
            mkdir -p "tWeb/public/assets/$ASSET_DIR"
            cp -r docs/public/. "tWeb/public/assets/$ASSET_DIR/"
          fi

      - name: Commit + push to tWeb
        env:
          DOCS_DIR: tLib
          ASSET_DIR: tLib
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          cd tWeb
          git config user.name "Gitea Actions Bot"
          git config user.email "actions@gitea.local"

          git add "src/content/docs/$DOCS_DIR/"
          [ -d "public/assets/$ASSET_DIR" ] && git add "public/assets/$ASSET_DIR/" || true

          if git diff --staged --quiet; then
            echo "No documentation changes to sync."
          else
            git commit -m "docs(tLib): sync from source ($ACTOR@${SHA:0:7})"
            git push
          fi
