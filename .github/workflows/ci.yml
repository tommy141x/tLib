name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun run setup` installs THREE trees: the root, client/web, and
      # shared/ts. The third was missing until 2026-10-21, and shared/ts has
      # its own package.json carrying the Solid 2 packages — `@solidjs/web`
      # and `solid-js` at 2.0.0-rc.14. Without it the Typecheck step below
      # reported 170 × TS7026 "no interface 'JSX.IntrinsicElements' exists",
      # `@solidjs/web/jsx-runtime` unresolvable, and `bun:test` missing, so
      # EVERY push to main sent a failure email while the same checks were
      # green locally — where the directory had been installed by hand once
      # and never thought about again.
      #
      # Measured by reproducing it in a worktree of main: root + client/web
      # installs give the CI error list exactly; adding shared/ts gives zero.
      - name: Install
        run: bun run setup

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      # shared/ts has its OWN tsconfig and its own jsx settings. The step
      # above is client/web's project, which pulls the shared TSX in under
      # `jsxImportSource: "solid-js"` — so the Solid 2 surface was compiled
      # only under the wrong jsx runtime and never under its own.
      - name: Typecheck shared
        run: bun run typecheck:shared

      # `typecheck:server` existed and nothing ran it, so it rotted: by the time
      # it was tried it failed on `baseUrl`, removed in TypeScript 7. The server
      # bundle is the half of tLib that holds the marketplace and community-config
      # HTTP, so it is not the half to leave unchecked.
      - name: Typecheck server
        run: bun run typecheck:server

      # Catches a relative specifier left behind by a move, which only fails at
      # the moment the module is first loaded and so can pass the suite below.
      - name: Relative imports resolve
        run: bun run check:imports

      - name: Test
        run: bun run test

      - name: Lua suites
        run: bun run test:lua

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun run setup

      - name: Build
        run: bun run build

      - name: Verify the three runtime artifacts exist
        run: |
          set -euo pipefail
          for f in client/ui/index.html client/ui/assets/hud-layout.js server/dist/bundle.js; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
          done
